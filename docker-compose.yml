version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: smartwealth
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  # MCP - 管理控制平面
  mcp:
    build: ./mcp
    ports:
      - "9000:9000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://app:changeme@postgres:5432/smartwealth
    volumes:
      - ./mcp:/app
    depends_on:
      - redis
      - postgres

  # LangGraph - 简单 graph executor
  langgraph:
    build: ./langgraph
    ports:
      - "8080:8080"
    environment:
      - MCP_URL=http://mcp:9000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./langgraph:/app
    depends_on:
      - mcp

  # skill-runner: demo skills (risk_calc, allocate, pdf_export)
  skill-runner:
    build: ./skills
    ports:
      - "8002:8002"
    environment:
      - MCP_URL=http://mcp:9000
    volumes:
      - ./skills:/app
    depends_on:
      - mcp

  # agent: 实际 orchestration worker
  agent:
    build: ./agent
    ports:
      - "8001:8001"
    environment:
      - MCP_URL=http://mcp:9000
      - LANGGRAPH_URL=http://langgraph:8080
      - SKILL_REGISTRY_URL=http://mcp:9000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./agent:/app
    depends_on:
      - mcp
      - langgraph
      - skill-runner

  # 简单后端（留作扩展/演示）
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MCP_URL=http://mcp:9000
    volumes:
      - ./backend:/app
    depends_on:
      - mcp

  # 前端静态 demo
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - agent

volumes:
  redis-data:
  pg-data:
